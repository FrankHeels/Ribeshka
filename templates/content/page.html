{% extends "base.html" %}
{% block content %}
  <header class="page-heading page-heading-narrow">
    <h1>{{ page_title }}</h1>
    {% if page_body %}<div class="page-lead rich-copy">{{ page_body|linebreaks }}</div>{% endif %}
  </header>
  {% if not page_body %}
    <div class="empty-state info-pending" role="status">
      <h2>Материалы ещё не добавлены</h2>
      <p>{{ content_notice }}</p>
      <a class="text-link" href="{% url 'home' %}#assortment">Посмотреть ассортимент</a>
    </div>
  {% endif %}
  {% block after_content %}{% endblock %}
{% endblock %}
