user nginx;
worker_processes auto;
pid /var/run/nginx.pid;
# Nginx error messages can contain the original URI, including credentials.
error_log /dev/null crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    client_max_body_size 10m;
    log_format safe '$remote_addr [$time_local] $request_method $uri '
                    '$status $body_bytes_sent $request_time';
    map $uri $log_request {
        default 1;
        ~^/integrations/moysklad/webhooks(?:/|$) 0;
        ~^/(?:checkout|wholesale)/success(?:/|$) 0;
    }
    access_log /var/log/nginx/access.log safe if=$log_request;

    upstream fishsite_app {
        server web:8000;
    }

    # The private HTTP proxy overwrites every trusted proxy header.
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        location ^~ /.well-known/acme-challenge/ {
            root /var/www/acme;
            default_type text/plain;
            limit_except GET { deny all; }
            try_files $uri =404;
        }

        location / {
            return 503;
        }
    }

    # Docker publishes this listener only on host 127.0.0.1 for an SSH tunnel.
    server {
        listen 8080 default_server;
        server_name _;

        location /static/ {
            alias /usr/share/nginx/html/static/;
            limit_except GET { deny all; }
            add_header X-Content-Type-Options nosniff always;
        }

        location /media/ {
            alias /usr/share/nginx/html/media/;
            limit_except GET { deny all; }
            add_header X-Content-Type-Options nosniff always;
        }

        location ^~ /integrations/moysklad/webhooks/ {
            access_log off;
            error_log /dev/null crit;
            client_max_body_size 1m;
            proxy_read_timeout 2s;
            proxy_pass http://fishsite_app;
        }

        location / {
            proxy_pass http://fishsite_app;
        }
    }
}
